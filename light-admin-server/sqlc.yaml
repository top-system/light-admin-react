version: "2"
sql:
  - engine: "postgresql"
    # Schema is the golang-migrate migration set; sqlc reads *.up.sql and
    # ignores *.down.sql, so migrations remain the single source of truth.
    schema: "db/migrations/postgres"
    queries: "db/queries/postgres"
    gen:
      go:
        package: "pg"
        out: "db/pg"
        sql_package: "pgx/v5"
        emit_interface: true                 # Querier interface -> mockable in tests
        emit_pointers_for_null_types: true    # nullable args/cols -> *T instead of pgtype.X
        emit_empty_slices: true               # :many returns []T{} not nil
        emit_exact_table_names: false
        emit_json_tags: false
        # Converge timestamptz onto the standard library time.Time (engine-neutral
        # target, see multi-database-plan §4) instead of pgtype.Timestamptz, so the
        # neutral store layer and repositories stay free of the pgx type. Nullable
        # columns/args map to *time.Time.
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
  - engine: "sqlite"
    schema: "db/migrations/sqlite"
    queries: "db/queries/sqlite"
    gen:
      go:
        package: "sqlitegen"
        out: "db/sqlitegen"
        emit_interface: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_exact_table_names: false
        emit_json_tags: false
        # SQLite stores every integer as int64; converge the 4-byte columns onto
        # int32 to match the engine-neutral store structs (postgres INTEGER).
        # The AUTOINCREMENT rowid PKs stay int64 via column-scoped overrides.
        overrides:
          - db_type: "INTEGER"
            go_type: "int32"
          - db_type: "INTEGER"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - column: "sys_tasks.id"
            go_type: "int64"
          - column: "sys_download_tasks.id"
            go_type: "int64"
